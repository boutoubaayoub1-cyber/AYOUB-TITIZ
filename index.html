<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.heart {
    position: fixed;
    bottom: -80px;
    left: 0;
    user-select: none;
    pointer-events: none;

    animation-name: float;
    animation-timing-function: linear;
    animation-fill-mode: forwards;

    filter:
        drop-shadow(0 0 6px rgba(255,0,50,.8))
        drop-shadow(0 0 14px rgba(255,0,50,.5));
}

@keyframes float {

    0% {
        transform:
            translate3d(0, 0, 0)
            rotate(0deg)
            scale(.7);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        transform:
            translate3d(var(--move), -55vh, 0)
            rotate(180deg)
            scale(1);
    }

    100% {
        transform:
            translate3d(var(--move2), -120vh, 0)
            rotate(360deg)
            scale(.8);

        opacity: 0;
    }
}
</style>
</head>

<body>

<script>

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "❤️";

    // Random position
    heart.style.left = Math.random() * 100 + "vw";

    // Random size
    heart.style.fontSize =
        (15 + Math.random() * 55) + "px";

    // Random movement
    heart.style.setProperty(
        "--move",
        (-100 + Math.random() * 200) + "px"
    );

    heart.style.setProperty(
        "--move2",
        (-180 + Math.random() * 360) + "px"
    );

    // Random speed
    const duration =
        4 + Math.random() * 5;

    heart.style.animationDuration =
        duration + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, duration * 1000);
}


// Create hearts continuously
setInterval(createHeart, 100);


// Create some immediately
for (let i = 0; i < 20; i++) {
    setTimeout(createHeart, i * 100);
}

</script>

</body>
</html>
