<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.photo {
    position: fixed;
    bottom: -180px;

    width: 110px;
    height: 145px;

    object-fit: cover;
    border-radius: 18px;

    box-shadow: 0 0 15px rgba(255,255,255,0.25);

    animation: fly linear forwards;

    pointer-events: none;
}

@keyframes fly {

    0% {
        transform: translate(0,0) rotate(0deg) scale(.6);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        transform:
        translate(var(--x1),-55vh)
        rotate(var(--r1))
        scale(1);
    }

    100% {
        transform:
        translate(var(--x2),-125vh)
        rotate(var(--r2))
        scale(.75);

        opacity: 0;
    }
}
</style>

<style>
body {
  background: black;
}
.my-photo {
  width: 180px;
  opacity: 1;
  filter: brightness(1.25) contrast(1.15);
}
</style></head>

<body>

<script>

function createPhoto() {

    let img = document.createElement("img");

    img.src = "photo.jpg";

    img.className = "photo";

    let size = 70 + Math.random() * 70;

    img.style.width = size + "px";
    img.style.height = (size * 1.3) + "px";

    img.style.left =
        Math.random() * 100 + "vw";

    img.style.setProperty(
        "--x1",
        (-100 + Math.random() * 200) + "px"
    );

    img.style.setProperty(
        "--x2",
        (-200 + Math.random() * 400) + "px"
    );

    img.style.setProperty(
        "--r1",
        (-20 + Math.random() * 40) + "deg"
    );

    img.style.setProperty(
        "--r2",
        (-40 + Math.random() * 80) + "deg"
    );

    let speed = 5 + Math.random() * 4;

    img.style.animationDuration = speed + "s";

    document.body.appendChild(img);

    setTimeout(function() {
        img.remove();
    }, speed * 1000);
}


for (let i = 0; i < 12; i++) {
    setTimeout(createPhoto, i * 300);
}

setInterval(createPhoto, 500);

</script>

<img src="photo.jpg" class="my-photo"></body>
</html>
